name: EducationOS Control Plane CI

on:
  push:
    branches: [main, "feat/**", "chatgpt/**"]
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane.yml"

permissions:
  contents: read

jobs:
  control-plane-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/control-plane/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run control-plane contract tests
        env:
          DATABASE_URL: sqlite:///./ci-control-plane.db
          AUTO_CREATE_SCHEMA: "false"
        run: pytest -q
