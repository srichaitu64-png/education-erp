# Codacy analysis is retained as a machine-readable artifact.
# SARIF generation in the current Codacy CLI crashes on a subset of Bandit
# findings (IndexOutOfBoundsException). JSON avoids that formatter failure
# while preserving analyzer findings for review; do not treat this as a clean scan.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 20 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI (JSON)
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.json
          format: json
          max-allowed-issues: 2147483647

      - name: Upload Codacy findings
        if: always() && hashFiles('results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codacy-security-findings
          path: results.json
          if-no-files-found: warn
          retention-days: 14
