name: EducationOS Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build Web Application
        working-directory: ./apps/web
        run: npm run build

  backend-tests:
    name: Backend Pytest Suite & Tenant Isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: education_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Full Regression Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/education_erp_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/education_erp_test
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum-jwt
        run: |
          pytest tests/ -v

