name: EducationOS Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Compose and database init script
        env:
          POSTGRES_DB: education_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          ERP_APP_PASSWORD: erp_app_pass
          SECRET_KEY: ci-compose-validation-secret-key-32-chars-minimum
        run: |
          docker compose config --quiet
          sh -n infrastructure/docker/init-db/01-create-app-role.sh

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        working-directory: ./apps/web
        run: npm run build

  backend-tests:
    name: Backend Pytest Suite & Tenant Isolation
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_URL: ${{ format('postgresql+asyncpg://erp_app:{0}@127.0.0.1:5433/education_erp_test', 'erp_app_pass') }}
      TEST_DATABASE_URL: ${{ format('postgresql+asyncpg://erp_app:{0}@127.0.0.1:5433/education_erp_test', 'erp_app_pass') }}
      TEST_ADMIN_DATABASE_URL: ${{ format('postgresql+asyncpg://postgres:{0}@127.0.0.1:5433/education_erp_test', 'postgres') }}
      PGPASSWORD: postgres
      SECRET_KEY: ci-test-secret-key-32-chars-long-minimum-jwt
      INITIAL_SUPERADMIN_PASSWORD: AdminSecurePassword2026!
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: education_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d education_erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Apply database migrations
        working-directory: ./apps/api
        env:
          DATABASE_URL: ${{ format('postgresql+asyncpg://postgres:{0}@127.0.0.1:5433/education_erp_test', 'postgres') }}
        run: python -m alembic upgrade head

      - name: Run Full Regression Test Suite
        run: pytest tests/ -v

