name: EducationOS Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build Web Application
        working-directory: ./apps/web
        run: npm run build

  backend-tests:
    name: Backend Pytest Suite & Tenant Isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: education_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      # PostgreSQL service starts with only its bootstrap superuser. Create the
      # two least-privilege test identities before pytest imports the app.
      - name: Provision isolated PostgreSQL test roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'erp_test_admin') THEN
              CREATE ROLE erp_test_admin LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOBYPASSRLS PASSWORD 'erp_test_admin_pass';
            ELSE
              ALTER ROLE erp_test_admin WITH LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOBYPASSRLS PASSWORD 'erp_test_admin_pass';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'erp_app') THEN
              CREATE ROLE erp_app LOGIN NOCREATEDB NOSUPERUSER NOCREATEROLE NOBYPASSRLS PASSWORD 'erp_app_pass';
            ELSE
              ALTER ROLE erp_app WITH LOGIN NOCREATEDB NOSUPERUSER NOCREATEROLE NOBYPASSRLS PASSWORD 'erp_app_pass';
            END IF;
          END
          $$;

          ALTER DATABASE education_erp_test OWNER TO erp_test_admin;
          GRANT CONNECT ON DATABASE education_erp_test TO erp_app;
          SQL

      - name: Run Full Regression Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://erp_app:erp_app_pass@localhost:5432/education_erp_test
          TEST_DATABASE_URL: postgresql+asyncpg://erp_app:erp_app_pass@localhost:5432/education_erp_test
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://erp_test_admin:erp_test_admin_pass@localhost:5432/education_erp_test
          INITIAL_SUPERADMIN_PASSWORD: AdminSecurePassword2026!
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum-jwt
        run: |
          pytest tests/ -v
